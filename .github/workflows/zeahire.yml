name: ZeaHire Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # -------------------------------
    # Checkout
    # -------------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # -------------------------------
    # Setup Python
    # -------------------------------
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # -------------------------------
    # Install Dependencies
    # -------------------------------
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest allure-pytest requests
        playwright install --with-deps

    # -------------------------------
    # Run Tests (DO NOT FAIL PIPELINE)
    # -------------------------------
    - name: Run Tests
      run: pytest --alluredir=allure-results
      continue-on-error: true

    # -------------------------------
    # Install Allure CLI
    # -------------------------------
    - name: Install Allure CLI
      if: always()
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jre
        wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
        tar -xzf allure-2.27.0.tgz
        sudo mv allure-2.27.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure

    # -------------------------------
    # Generate Allure Report
    # -------------------------------
    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report

    # -------------------------------
    # Prepare GitHub Pages
    # -------------------------------
    - name: Setup Pages
      if: always()
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report

    # -------------------------------
    # Deploy to GitHub Pages
    # -------------------------------
    - name: Deploy to GitHub Pages
      if: always()
      id: deployment
      uses: actions/deploy-pages@v4

    # -------------------------------
    # Send Email (FIXED)
    # -------------------------------
    - name: Send Email via SendGrid
      if: always()
      run: |
        python - <<EOF
        import requests
        import os

        SENDGRID_API_KEY = os.getenv("SENDGRID_API_KEY")
        TO_EMAIL = os.getenv("TO_EMAIL")
        FROM_EMAIL = os.getenv("FROM_EMAIL")

        report_url = "https://jijo-z.github.io/zeahire-automation/"

        data = {
            "personalizations": [{
                "to": [{"email": TO_EMAIL}],
                "subject": "ZeaHire Automation Report"
            }],
            "from": {"email": FROM_EMAIL},
            "content": [{
                "type": "text/html",
                "value": f"""
                <h2>Automation Report</h2>
                <p>Your test execution is complete.</p>
                <p><a href="{report_url}">View Allure Report</a></p>
                """
            }]
        }

        response = requests.post(
            "https://api.sendgrid.com/v3/mail/send",
            headers={
                "Authorization": f"Bearer {SENDGRID_API_KEY}",
                "Content-Type": "application/json"
            },
            json=data
        )

        print(response.status_code, response.text)
        EOF

    # -------------------------------
    # Force Success (optional)
    # -------------------------------
    - name: Force Success
      if: always()
      run: exit 0