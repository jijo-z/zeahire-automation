name: ZeaHire Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write   # 🔥 REQUIRED for GitHub Pages

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://qa.zeahire.ai
      EMAIL: jijo@zealogics.com
      PASSWORD: Admin@123
      HEADLESS: true
      RECIPIENTS: jijo@zealogics.com,sheefeena@zealogics.com

    steps:

    # ==============================
    # Checkout
    # ==============================
    - name: Checkout code
      uses: actions/checkout@v4

    # ==============================
    # Python Setup
    # ==============================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    # ==============================
    # Install Dependencies
    # ==============================
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest playwright allure-pytest requests
        playwright install --with-deps

    # ==============================
    # Run Tests (DO NOT BREAK PIPELINE)
    # ==============================
    - name: Run Tests
      run: |
        pytest --alluredir=allure-results || true

    # ==============================
    # Install Allure CLI
    # ==============================
    - name: Install Allure CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y allure

    # ==============================
    # Generate Allure Report
    # ==============================
    - name: Generate Allure Report
      run: |
        allure generate allure-results -o allure-report --clean

    # ==============================
    # Upload Pages Artifact
    # ==============================
    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report

    # ==============================
    # Deploy to GitHub Pages
    # ==============================
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    # ==============================
    # Send Email via SendGrid
    # ==============================
    - name: Send Email via SendGrid
      if: always()
      env:
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      run: |
        python - <<EOF
        import os
        import requests

        api_key = os.getenv("SENDGRID_API_KEY")
        recipients = os.getenv("RECIPIENTS").split(",")

        report_url = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

        to_list = [{"email": r.strip()} for r in recipients]

        data = {
            "personalizations": [
                {
                    "to": to_list
                }
            ],
            "from": {"email": "jijo@zealogics.com"},
            "subject": "ZeaHire Automation Report",
            "content": [
                {
                    "type": "text/html",
                    "value": f"<h3>Test Execution Completed</h3><p>View report: <a href='{report_url}'>{report_url}</a></p>"
                }
            ]
        }

        response = requests.post(
            "https://api.sendgrid.com/v3/mail/send",
            headers={
                "Authorization": f"Bearer {api_key}",
                "Content-Type": "application/json"
            },
            json=data
        )

        print(response.status_code, response.text)
        EOF

    # ==============================
    # Force Success (FINAL SAFETY)
    # ==============================
    - name: Force Success
      if: always()
      run: exit 0