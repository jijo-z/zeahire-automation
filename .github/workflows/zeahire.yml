name: ZeaHire Stable CI

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "30 3 * * *"   # 9 AM IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

    # ================= CHECKOUT =================
    - name: Checkout Code
      uses: actions/checkout@v4


    # ================= PYTHON =================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    # ================= INSTALL =================
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-rerunfailures allure-pytest
        playwright install --with-deps


    # ================= RUN TESTS =================
    - name: Run Tests (DO NOT FAIL PIPELINE)
      run: |
        pytest --reruns 2 --alluredir=allure-results
      continue-on-error: true


    # ================= INSTALL ALLURE =================
    - name: Install Allure CLI
      if: always()
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jre
        wget https://github.com/allure-framework/allure2/releases/latest/download/allure-2.27.0.tgz
        tar -xvzf allure-2.27.0.tgz
        sudo mv allure-2.27.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure


    # ================= GENERATE REPORT =================
    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results -o allure-report --clean


    # ================= ENSURE INDEX =================
    - name: Ensure index.html exists
      if: always()
      run: |
        if [ ! -f allure-report/index.html ]; then
          echo "<h1>No Report Generated</h1>" > allure-report/index.html
        fi


    # ================= UPLOAD =================
    - name: Upload Pages Artifact
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report


    # ================= DEPLOY =================
    - name: Deploy to GitHub Pages
      if: always()
      uses: actions/deploy-pages@v4


    # ================= EMAIL =================
    - name: Send Email with Report Link
      if: always()
      continue-on-error: true
      env:
        EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        python - <<EOF
        import smtplib
        from email.mime.text import MIMEText

        report_url = "https://jijo-z.github.io/zeahire-automation/"

        msg = MIMEText(f"Allure Report: {report_url}")
        msg['Subject'] = 'ZeaHire Automation Report'
        msg['From'] = "${EMAIL_USERNAME}"
        msg['To'] = "${EMAIL_USERNAME}"

        try:
            server = smtplib.SMTP_SSL('smtp.gmail.com', 465)
            server.login("${EMAIL_USERNAME}", "${EMAIL_PASSWORD}")
            server.send_message(msg)
            server.quit()
            print("Email sent successfully!")
        except Exception as e:
            print(f"Email failed: {e}")
        EOF


    # ================= FORCE SUCCESS =================
    - name: Force Success (IMPORTANT)
      if: always()
      run: exit 0