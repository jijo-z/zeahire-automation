name: ZeaHire Stable CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

    # ================= CHECKOUT =================
    - name: Checkout Code
      uses: actions/checkout@v4

    # ================= PYTHON =================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # ================= INSTALL =================
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-rerunfailures allure-pytest
        playwright install --with-deps

    # ================= RUN TESTS =================
    - name: Run Tests (DO NOT FAIL PIPELINE)
      run: |
        pytest --reruns 2 --alluredir=allure-results
      continue-on-error: true

    # ================= INSTALL ALLURE (FIXED) =================
    - name: Install Allure CLI
      if: always()
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.29.0/allure-commandline-2.29.0.zip
        unzip allure-commandline-2.29.0.zip
        sudo mv allure-2.29.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure

    # ================= GENERATE REPORT =================
    - name: Generate Allure Report
      if: always()
      run: |
        if [ -d "allure-results" ]; then
          allure generate allure-results --clean -o allure-report
        else
          echo "No results found"
          mkdir -p allure-report
        fi

    # ================= DEBUG =================
    - name: Debug Report
      if: always()
      run: |
        ls -la
        ls -la allure-report || echo "Report missing"

    # ================= UPLOAD =================
    - name: Upload Pages Artifact
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report

    # ================= DEPLOY =================
    - name: Deploy to GitHub Pages
      if: always()
      uses: actions/deploy-pages@v4

    # ================= EMAIL =================
    - name: Send Email
      if: always()
      continue-on-error: true
      env:
        EMAIL_USERNAME: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASS }}
        EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
      run: |
        python - <<EOF
        import os
        import smtplib
        from email.mime.text import MIMEText

        EMAIL = os.environ.get("EMAIL_USERNAME")
        PASSWORD = os.environ.get("EMAIL_PASSWORD")
        TO = os.environ.get("EMAIL_RECEIVERS")

        print("Using email:", EMAIL)

        report_url = "https://jijo-z.github.io/zeahire-automation/"

        msg = MIMEText(f"Allure Report: {report_url}")
        msg['Subject'] = 'ZeaHire Automation Report'
        msg['From'] = EMAIL
        msg['To'] = TO

        try:
            server = smtplib.SMTP_SSL('smtp.gmail.com', 465)
            server.login(EMAIL, PASSWORD)
            server.send_message(msg)
            server.quit()
            print("✅ Email sent")
        except Exception as e:
            print("❌ Email failed:", e)
        EOF
    # ================= FORCE SUCCESS =================
    - name: Force Success
      if: always()
      run: exit 0