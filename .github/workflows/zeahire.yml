name: ZeaHire Stable CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

    # ================= CHECKOUT =================
    - name: Checkout Code
      uses: actions/checkout@v4

    # ================= PYTHON =================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # ================= INSTALL =================
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-rerunfailures allure-pytest
        playwright install --with-deps

    # ================= RUN TESTS =================
    - name: Run Tests (DO NOT FAIL PIPELINE)
      run: |
        pytest --reruns 2 --alluredir=allure-results
      continue-on-error: true

    # ================= GENERATE ALLURE (FIXED) =================
    - name: Generate Allure Report
      if: always()
      uses: simple-elf/allure-report-action@v1
      with:
        allure_results: allure-results
        allure_report: allure-report

    # ================= DEBUG =================
    - name: Debug Report
      if: always()
      run: |
        ls -la
        ls -la allure-report || echo "No report generated"

    # ================= UPLOAD =================
    - name: Upload Pages Artifact
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report

    # ================= DEPLOY =================
    - name: Deploy to GitHub Pages
      if: always()
      uses: actions/deploy-pages@v4

    # ================= EMAIL =================
    - name: Send Email
      if: always()
      continue-on-error: true
      env:
        EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        python - <<EOF
        import smtplib
        from email.mime.text import MIMEText

        report_url = "https://jijo-z.github.io/zeahire-automation/"

        msg = MIMEText(f"Allure Report: {report_url}")
        msg['Subject'] = 'ZeaHire Automation Report'
        msg['From'] = "${EMAIL_USERNAME}"
        msg['To'] = "${EMAIL_USERNAME}"

        try:
            server = smtplib.SMTP_SSL('smtp.gmail.com', 465)
            server.login("${EMAIL_USERNAME}", "${EMAIL_PASSWORD}")
            server.send_message(msg)
            server.quit()
            print("Email sent")
        except Exception as e:
            print(e)
        EOF

    # ================= FORCE SUCCESS =================
    - name: Force Success
      if: always()
      run: exit 0