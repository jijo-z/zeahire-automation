name: ZeaHire Automation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:

      # ======================
      # Checkout Code
      # ======================
      - name: Checkout code
        uses: actions/checkout@v4

      # ======================
      # Setup Python
      # ======================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================
      # Install Dependencies
      # ======================
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest playwright allure-pytest requests
          playwright install --with-deps

      # ======================
      # Run Tests (DO NOT FAIL PIPELINE)
      # ======================
      - name: Run Tests
        run: |
          pytest --alluredir=allure-results || true

      # ======================
      # Install Allure (STABLE WAY)
      # ======================
      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # ======================
      # Generate Allure Report
      # ======================
      - name: Generate Allure Report
        run: |
          allure generate allure-results -o allure-report --clean

      # ======================
      # Upload Report
      # ======================
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # ======================
      # Deploy Report
      # ======================
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # ======================
      # Send Email via SendGrid
      # ======================
      - name: Send Email via SendGrid
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python - <<EOF
          import requests
          import os

          url = "https://api.sendgrid.com/v3/mail/send"

          headers = {
              "Authorization": "Bearer " + os.environ["SENDGRID_API_KEY"],
              "Content-Type": "application/json"
          }

          data = {
            "personalizations": [{
              "to": [
                {"email": "john@zealogics.com"},
                {"email": "johnshajan007@gmail.com"},
                {"email": "kamal@zealogics.com"},
                {"email": "shefeena@zealogics.com"}
              ],
              "subject": "ZeaHire Automation Report"
            }],
            "from": {
              "email": "jijo@zealogics.com"
            },
            "content": [{
              "type": "text/plain",
              "value": "Hi Team,\n\nAutomation run completed.\n\nCheck report:\nhttps://jijo-z.github.io/zeahire-automation/\n\nRegards,\nQA Bot"
            }]
          }

          response = requests.post(url, headers=headers, json=data)
          print("Status:", response.status_code)
          print("Response:", response.text)
          EOF

      # ======================
      # Force Success (pipeline always green)
      # ======================
      - name: Force Success
        run: exit 0