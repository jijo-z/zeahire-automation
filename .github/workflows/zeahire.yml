name: ZeaHire Automation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest playwright allure-pytest requests
          playwright install --with-deps

      - name: Run Tests
        run: |
          pytest --alluredir=allure-results || true

      # ✅ STABLE ALLURE INSTALL
      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y allure

      - name: Generate Allure Report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # ✅ FIXED SENDGRID
      - name: Send Email via SendGrid
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python - <<EOF
          import requests
          import os

          url = "https://api.sendgrid.com/v3/mail/send"

          headers = {
              "Authorization": "Bearer " + os.environ["SENDGRID_API_KEY"],
              "Content-Type": "application/json"
          }

          data = {
            "personalizations": [{
              "to": [
                {"email": "jijo@zealogics.com"}
              ],
              "subject": "ZeaHire Automation Report"
            }],
            "from": {
              "email": "jijo@zealogics.com"
            },
            "content": [{
              "type": "text/plain",
              "value": "Automation completed.\n\nReport:\nhttps://jijo-z.github.io/zeahire-automation/"
            }]
          }

          response = requests.post(url, headers=headers, json=data)
          print(response.status_code, response.text)
          EOF

      - name: Force Success
        run: exit 0