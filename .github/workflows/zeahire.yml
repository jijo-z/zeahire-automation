name: ZeaHire Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write   # ✅ required for GitHub Pages

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------
      # 🐍 Setup Python
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -------------------------
      # 📦 Install Dependencies
      # -------------------------
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-playwright allure-pytest requests
          playwright install --with-deps

      # -------------------------
      # 🎭 Run Tests (HEADLESS)
      # -------------------------
      - name: Run Tests
        run: |
          pytest --alluredir=allure-results
        continue-on-error: true   # ✅ IMPORTANT (don’t break pipeline)

      # -------------------------
      # 📊 Install Allure (FIXED)
      # -------------------------
      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/latest/download/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # -------------------------
      # 📈 Generate Report
      # -------------------------
      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
          wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.25.0/allure-commandline-2.25.0.zip
          unzip -q allure-commandline-2.25.0.zip -d /opt/
          sudo ln -s /opt/allure-2.25.0/bin/allure /usr/local/bin/allure
          allure --version
      # -------------------------
      # 📦 Upload Artifact
      # -------------------------
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # -------------------------
      # 🌍 Deploy to GitHub Pages
      # -------------------------
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # -------------------------
      # 📧 Send Email (SendGrid)
      # -------------------------
      - name: Send Email via SendGrid
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python - <<EOF
          import requests

          url = "https://api.sendgrid.com/v3/mail/send"

          headers = {
              "Authorization": f"Bearer { "${{ secrets.SENDGRID_API_KEY }}" }",
              "Content-Type": "application/json"
          }

          data = {
              "personalizations": [
                  {
                      "to": [
                          {"email": "john@zealogics.com"},
                          {"email": "johnshajan007@gmail.com"},
                          {"email": "kamal@zealogics.com"},
                          {"email": "shefeena@zealogics.com"}
                      ],
                      "subject": "ZeaHire Automation Report"
                  }
              ],
              "from": {
                  "email": "jijo@zealogics.com"
              },
              "content": [
                  {
                      "type": "text/plain",
                      "value": "Hi Team,\n\nAutomation run completed.\n\nCheck report:\nhttps://jijo-z.github.io/zeahire-automation/\n\nRegards,\nQA Bot"
                  }
              ]
          }

          response = requests.post(url, headers=headers, json=data)
          print(response.status_code, response.text)
          EOF

      # -------------------------
      # 🟢 Force Success (Optional)
      # -------------------------
      - name: Force Success
        run: exit 0