name: ZeaHire Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------
      # Python Setup
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -------------------------
      # Install Dependencies
      # -------------------------
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-playwright allure-pytest requests
          playwright install --with-deps

      # -------------------------
      # Run Tests (HEADLESS)
      # -------------------------
      - name: Run Tests
        run: |
          pytest --alluredir=allure-results
        continue-on-error: true   # ✅ pipeline won't break

      # -------------------------
      # Install Allure (FIXED URL)
      # -------------------------
      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz

      # -------------------------
      # Generate Allure Report
      # -------------------------
      - name: Generate Allure Report
        run: |
          ./allure-2.27.0/bin/allure generate allure-results -o allure-report --clean

      # -------------------------
      # Upload Report
      # -------------------------
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # -------------------------
      # Deploy Report
      # -------------------------
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # -------------------------
      # Send Email (SendGrid)
      # -------------------------
      - name: Send Email via SendGrid
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python - <<EOF
          import requests

          url = "https://api.sendgrid.com/v3/mail/send"

          headers = {
              "Authorization": "Bearer " + "${{ secrets.SENDGRID_API_KEY }}",
              "Content-Type": "application/json"
          }

          data = {
              "personalizations": [
                  {
                      "to": [
                          {"email": "john@zealogics.com"},
                          {"email": "johnshajan007@gmail.com"},
                          {"email": "kamal@zealogics.com"},
                          {"email": "shefeena@zealogics.com"}
                      ],
                      "subject": "ZeaHire Automation Report"
                  }
              ],
              "from": {
                  "email": "jijo@zealogics.com"
              },
              "content": [
                  {
                      "type": "text/plain",
                      "value": "Hi Team,\n\nAutomation run completed.\n\nCheck report:\nhttps://jijo-z.github.io/zeahire-automation/\n\nRegards,\nQA Bot"
                  }
              ]
          }

          response = requests.post(url, headers=headers, json=data)
          print(response.status_code, response.text)
          EOF

      # -------------------------
      # Force Success (optional)
      # -------------------------
      - name: Force Success
        run: exit 0